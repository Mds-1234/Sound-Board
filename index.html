<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Sound Board</h1>

    <div class="container">
        <button class="whistle">Whistle</button>
        <button class="sneeze">Sneeze</button>
        <button class="roar">Roar</button>
        <button class="clown_horn">Clown horn</button>
        <button class="siren">Siren</button>
        <button class="laugh">Laugh</button>
    </div>
    <div class="controls">
       <input type="range" class="volume" min="0" max="100" value="100">
       <button class="mute">Mute</button>
    </div>

</body>
<script src="script.js"></script>
</html>
